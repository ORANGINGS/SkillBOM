name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - name: Ruff check
        id: ruff
        continue-on-error: true
        run: ruff check . --output-format=json > ruff-report.json
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-${{ matrix.python-version }}
          path: ruff-report.json
      - name: Fail on Ruff diagnostics
        if: steps.ruff.outcome == 'failure'
        run: exit 1
      - run: pytest --cov=skillbom --cov-report=term-missing
      - run: skillbom scan examples/safe-skill --fail-on high
      - run: skillbom gate .github/skills --policy skillbom.policy.yml
      - run: skillbom gate examples/risky-skill --policy skillbom.policy.yml --format json --output /tmp/risky-policy.json && exit 1 || test $? -eq 2

  sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: skillbom scan .github/skills --format sarif --output skillbom.sarif
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: skillbom.sarif
