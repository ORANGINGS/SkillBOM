name: SkillBOM scan
description: Scan Agent Skills or enforce a policy-as-code security gate.
author: ORANGINGS
inputs:
  target:
    description: Skill directory, SKILL.md, or skills root
    required: false
    default: .github/skills
  policy:
    description: Optional SkillBOM policy YAML. When set, policy gate mode is used.
    required: false
    default: ""
  fail-on:
    description: Finding or policy-violation severity threshold
    required: false
    default: high
  sarif-output:
    description: SARIF output path
    required: false
    default: skillbom.sarif
  as-of:
    description: Optional YYYY-MM-DD date for reproducible exception evaluation
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install SkillBOM
      shell: bash
      run: pip install "${GITHUB_ACTION_PATH}"
    - name: Scan Agent Skills
      if: ${{ inputs.policy == '' }}
      shell: bash
      run: >-
        skillbom scan "${{ inputs.target }}"
        --format sarif
        --output "${{ inputs.sarif-output }}"
        --fail-on "${{ inputs.fail-on }}"
    - name: Enforce SkillBOM policy
      if: ${{ inputs.policy != '' }}
      shell: bash
      env:
        SKILLBOM_AS_OF: ${{ inputs.as-of }}
      run: |
        args=(
          skillbom gate "${{ inputs.target }}"
          --policy "${{ inputs.policy }}"
          --format sarif
          --output "${{ inputs.sarif-output }}"
          --fail-on "${{ inputs.fail-on }}"
        )
        if [[ -n "${SKILLBOM_AS_OF}" ]]; then
          args+=(--as-of "${SKILLBOM_AS_OF}")
        fi
        "${args[@]}"
branding:
  icon: shield
  color: blue
